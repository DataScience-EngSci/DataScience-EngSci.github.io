<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="100%" height="100%">
  <defs>
    <linearGradient id="pml-adv-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181829"/>
      <stop offset="50%" stop-color="#281a3d"/>
      <stop offset="100%" stop-color="#0f0c1a"/>
    </linearGradient>
  </defs>

  <rect width="320" height="440" rx="8" fill="url(#pml-adv-grad)" stroke="#473b63" stroke-width="1.5"/>
  <line x1="22" y1="0" x2="22" y2="440" stroke="#000" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="24" y1="0" x2="24" y2="440" stroke="#fff" stroke-opacity="0.1" stroke-width="1"/>

  <!-- MIT Press Logo Bars -->
  <g transform="translate(36, 32)">
    <rect x="0" y="0" width="3" height="18" fill="#ffffff"/>
    <rect x="5" y="0" width="3" height="18" fill="#ffffff"/>
    <rect x="10" y="0" width="3" height="18" fill="#ffffff"/>
    <rect x="15" y="0" width="3" height="18" fill="#ffffff"/>
    <rect x="20" y="0" width="3" height="18" fill="#ffffff"/>
    <rect x="25" y="0" width="3" height="18" fill="#ffffff"/>
    <text x="36" y="14" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" letter-spacing="1">THE MIT PRESS</text>
  </g>

  <!-- Title -->
  <text x="36" y="96" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Georgia, serif" font-size="25" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Probabilistic</text>
  <text x="36" y="126" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Georgia, serif" font-size="25" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Machine Learning</text>

  <!-- Subtitle -->
  <text x="36" y="156" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14" fill="#c084fc" font-weight="600">Advanced Topics</text>

  <!-- Advanced Diffusion / Latent Space Manifold Graphic -->
  <g transform="translate(45, 185)">
    <rect width="230" height="135" rx="6" fill="#120e20" stroke="#372b50" stroke-width="1"/>
    
    <!-- Manifold contour rings -->
    <ellipse cx="115" cy="70" rx="80" ry="45" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.5"/>
    <ellipse cx="115" cy="70" rx="55" ry="30" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-opacity="0.8"/>
    <ellipse cx="115" cy="70" rx="25" ry="14" fill="none" stroke="#f472b6" stroke-width="2"/>
    
    <!-- Generative flow arrows -->
    <path d="M 40 40 Q 80 15, 115 70 T 190 100" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="115" cy="70" r="5" fill="#f472b6"/>
  </g>

  <!-- Author -->
  <text x="36" y="370" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Kevin P. Murphy</text>
  <text x="36" y="390" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" fill="#94a3b8">Adaptive Computation and Machine Learning Series &bull; 2023</text>
</svg>

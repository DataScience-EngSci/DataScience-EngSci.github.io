<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="100%" height="100%">
  <defs>
    <linearGradient id="prml-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a0e17"/>
      <stop offset="60%" stop-color="#2c0c12"/>
      <stop offset="100%" stop-color="#140407"/>
    </linearGradient>
  </defs>

  <!-- Cover Background -->
  <rect width="320" height="440" rx="8" fill="url(#prml-grad)"/>

  <!-- Spine groove -->
  <line x1="22" y1="0" x2="22" y2="440" stroke="#000" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="24" y1="0" x2="24" y2="440" stroke="#fff" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Series -->
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10" font-weight="600" fill="#f87171" letter-spacing="1.5">INFORMATION SCIENCE AND STATISTICS</text>
  <line x1="40" y1="54" x2="280" y2="54" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Title -->
  <text x="40" y="105" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Georgia, serif" font-size="25" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Pattern</text>
  <text x="40" y="135" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Georgia, serif" font-size="25" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Recognition</text>
  <text x="40" y="165" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Georgia, serif" font-size="25" font-weight="800" fill="#ffffff" letter-spacing="-0.5">and Machine</text>
  <text x="40" y="195" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Georgia, serif" font-size="25" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Learning</text>

  <!-- Bayesian graphical model artwork -->
  <g transform="translate(60, 220)" opacity="0.95">
    <rect width="200" height="120" rx="6" fill="#1f090d" stroke="#5c1622" stroke-width="1"/>
    
    <!-- Gaussian mixture contour lines -->
    <ellipse cx="65" cy="65" rx="35" ry="22" fill="none" stroke="#f87171" stroke-width="1.5" stroke-dasharray="3 3"/>
    <ellipse cx="65" cy="65" rx="20" ry="12" fill="none" stroke="#ef4444" stroke-width="2"/>
    <circle cx="65" cy="65" r="3" fill="#ffffff"/>

    <ellipse cx="140" cy="55" rx="42" ry="26" transform="rotate(-20 140 55)" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3 3"/>
    <ellipse cx="140" cy="55" rx="24" ry="14" transform="rotate(-20 140 55)" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="140" cy="55" r="3" fill="#ffffff"/>

    <!-- Probabilistic Graphical Model Nodes -->
    <circle cx="50" cy="20" r="10" fill="#2c0c12" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="50" y="24" font-family="serif" font-size="11" font-style="italic" fill="#ffffff" text-anchor="middle">μ</text>

    <circle cx="150" cy="20" r="10" fill="#2c0c12" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="150" y="24" font-family="serif" font-size="11" font-style="italic" fill="#ffffff" text-anchor="middle">Σ</text>

    <line x1="58" y1="26" x2="65" y2="45" stroke="#fca5a5" stroke-width="1"/>
    <line x1="145" y1="28" x2="140" y2="40" stroke="#fca5a5" stroke-width="1"/>
  </g>

  <!-- Author -->
  <text x="40" y="390" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="15" font-weight="700" fill="#ffffff">Christopher M. Bishop</text>

  <!-- Springer logo tag -->
  <text x="250" y="415" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="12" font-weight="700" fill="#fca5a5" text-anchor="middle">Springer</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="100%" height="100%">
  <defs>
    <linearGradient id="esl-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0b1726"/>
    </linearGradient>
    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#f5e086"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Cover Background -->
  <rect width="320" height="440" rx="8" fill="url(#esl-grad)"/>

  <!-- Spine groove -->
  <line x1="22" y1="0" x2="22" y2="440" stroke="#000" stroke-opacity="0.3" stroke-width="2"/>
  <line x1="24" y1="0" x2="24" y2="440" stroke="#fff" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Series Header -->
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="11" font-weight="600" fill="#a0aec0" letter-spacing="1.5">SPRINGER SERIES IN STATISTICS</text>
  <rect x="40" y="55" width="240" height="2" fill="url(#gold-accent)"/>

  <!-- Title -->
  <text x="40" y="110" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Georgia, serif" font-size="25" font-weight="700" fill="#ffffff" letter-spacing="-0.5">The Elements</text>
  <text x="40" y="140" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Georgia, serif" font-size="25" font-weight="700" fill="#ffffff" letter-spacing="-0.5">of Statistical</text>
  <text x="40" y="170" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Georgia, serif" font-size="25" font-weight="700" fill="#ffffff" letter-spacing="-0.5">Learning</text>

  <!-- Subtitle -->
  <text x="40" y="200" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" fill="#cbd5e1" font-weight="400">Data Mining, Inference, and Prediction</text>

  <!-- Edition Badge -->
  <rect x="40" y="218" width="88" height="22" rx="4" fill="#d4af37" fill-opacity="0.2" stroke="#d4af37" stroke-width="1"/>
  <text x="48" y="233" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10" font-weight="600" fill="#f5e086" letter-spacing="0.5">SECOND EDITION</text>

  <!-- Graphical Element: Data Scatter & Decision Boundary -->
  <g transform="translate(40, 255)" opacity="0.85">
    <rect width="240" height="95" rx="6" fill="#0f2137" stroke="#254366" stroke-width="1"/>
    <!-- Grid lines -->
    <line x1="0" y1="24" x2="240" y2="24" stroke="#1d3557" stroke-dasharray="2 4"/>
    <line x1="0" y1="48" x2="240" y2="48" stroke="#1d3557" stroke-dasharray="2 4"/>
    <line x1="0" y1="72" x2="240" y2="72" stroke="#1d3557" stroke-dasharray="2 4"/>
    <line x1="60" y1="0" x2="60" y2="95" stroke="#1d3557" stroke-dasharray="2 4"/>
    <line x1="120" y1="0" x2="120" y2="95" stroke="#1d3557" stroke-dasharray="2 4"/>
    <line x1="180" y1="0" x2="180" y2="95" stroke="#1d3557" stroke-dasharray="2 4"/>
    
    <!-- Decision curve -->
    <path d="M 10 80 Q 70 20, 130 50 T 230 15" fill="none" stroke="#d4af37" stroke-width="2.5"/>
    
    <!-- Blue cluster -->
    <circle cx="35" cy="65" r="4" fill="#38bdf8"/>
    <circle cx="50" cy="75" r="4" fill="#38bdf8"/>
    <circle cx="75" cy="55" r="4" fill="#38bdf8"/>
    <circle cx="90" cy="70" r="4" fill="#38bdf8"/>
    <circle cx="120" cy="78" r="4" fill="#38bdf8"/>
    
    <!-- Orange cluster -->
    <circle cx="45" cy="25" r="4" fill="#f97316"/>
    <circle cx="85" cy="22" r="4" fill="#f97316"/>
    <circle cx="140" cy="35" r="4" fill="#f97316"/>
    <circle cx="170" cy="20" r="4" fill="#f97316"/>
    <circle cx="210" cy="40" r="4" fill="#f97316"/>
  </g>

  <!-- Authors -->
  <text x="40" y="380" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Trevor Hastie</text>
  <text x="40" y="396" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Robert Tibshirani</text>
  <text x="40" y="412" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Jerome Friedman</text>

  <!-- Springer logo tag -->
  <text x="250" y="412" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">Springer</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="100%" height="100%">
  <defs>
    <linearGradient id="islr-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="islr-band" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <rect width="320" height="440" rx="8" fill="url(#islr-bg)" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="22" y1="0" x2="22" y2="440" stroke="#000" stroke-opacity="0.08" stroke-width="2"/>
  <line x1="24" y1="0" x2="24" y2="440" stroke="#fff" stroke-opacity="0.8" stroke-width="1"/>

  <!-- Springer Series Header -->
  <rect x="0" y="0" width="320" height="14" fill="#0284c7"/>
  <text x="36" y="44" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10.5" font-weight="700" fill="#0284c7" letter-spacing="1">SPRINGER TEXTS IN STATISTICS</text>

  <!-- Title -->
  <text x="36" y="95" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Georgia, serif" font-size="27" font-weight="800" fill="#0f172a" letter-spacing="-0.5">An Introduction</text>
  <text x="36" y="128" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Georgia, serif" font-size="27" font-weight="800" fill="#0f172a" letter-spacing="-0.5">to Statistical</text>
  <text x="36" y="161" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Georgia, serif" font-size="27" font-weight="800" fill="#0f172a" letter-spacing="-0.5">Learning</text>

  <!-- Subtitle -->
  <text x="36" y="194" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" fill="#0284c7" font-weight="600">with Applications in R</text>
  <text x="36" y="212" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" fill="#64748b" font-weight="500">Seventh Printing</text>

  <!-- Graphical Element: Regression & Classification plot -->
  <g transform="translate(45, 235)">
    <rect width="230" height="100" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
    <!-- Axes -->
    <line x1="20" y1="80" x2="210" y2="80" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="20" y1="80" x2="20" y2="15" stroke="#94a3b8" stroke-width="1.5"/>
    
    <!-- True model curve & estimate curve -->
    <path d="M 25 70 C 60 75, 100 20, 150 40 S 190 20, 205 15" fill="none" stroke="#ef4444" stroke-width="2.5"/>
    <path d="M 25 75 Q 80 45, 140 35 T 205 20" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 3"/>

    <!-- Data points -->
    <circle cx="40" cy="72" r="3" fill="#0284c7"/>
    <circle cx="70" cy="60" r="3" fill="#0284c7"/>
    <circle cx="95" cy="30" r="3" fill="#0284c7"/>
    <circle cx="120" cy="45" r="3" fill="#0284c7"/>
    <circle cx="155" cy="38" r="3" fill="#0284c7"/>
    <circle cx="180" cy="22" r="3" fill="#0284c7"/>
  </g>

  <!-- Authors -->
  <text x="36" y="365" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11.5" font-weight="600" fill="#1e293b">Gareth James &bull; Daniela Witten</text>
  <text x="36" y="382" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11.5" font-weight="600" fill="#1e293b">Trevor Hastie &bull; Robert Tibshirani</text>

  <!-- Springer Logo at Bottom -->
  <rect x="0" y="405" width="320" height="35" fill="#0f172a"/>
  <text x="160" y="427" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">Springer</text>
</svg>

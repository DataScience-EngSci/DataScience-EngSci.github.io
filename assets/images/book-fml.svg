<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="100%" height="100%">
  <defs>
    <linearGradient id="fml-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>
  </defs>

  <rect width="320" height="440" rx="8" fill="url(#fml-grad)" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="22" y1="0" x2="22" y2="440" stroke="#000" stroke-opacity="0.08" stroke-width="2"/>
  <line x1="24" y1="0" x2="24" y2="440" stroke="#fff" stroke-opacity="0.8" stroke-width="1"/>

  <!-- Red top banner for MIT Press -->
  <rect x="0" y="0" width="320" height="12" fill="#dc2626"/>

  <!-- MIT Press Logo Bars -->
  <g transform="translate(36, 32)">
    <rect x="0" y="0" width="3" height="18" fill="#dc2626"/>
    <rect x="5" y="0" width="3" height="18" fill="#dc2626"/>
    <rect x="10" y="0" width="3" height="18" fill="#dc2626"/>
    <rect x="15" y="0" width="3" height="18" fill="#dc2626"/>
    <rect x="20" y="0" width="3" height="18" fill="#dc2626"/>
    <rect x="25" y="0" width="3" height="18" fill="#dc2626"/>
    <text x="36" y="14" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10.5" font-weight="700" fill="#0f172a" letter-spacing="1">THE MIT PRESS</text>
  </g>

  <!-- Title -->
  <text x="36" y="98" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Georgia, serif" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="-0.5">Foundations of</text>
  <text x="36" y="132" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Georgia, serif" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="-0.5">Machine</text>
  <text x="36" y="166" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Georgia, serif" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="-0.5">Learning</text>

  <!-- Edition Badge -->
  <rect x="36" y="180" width="95" height="22" rx="4" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="44" y="195" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="9.5" font-weight="700" fill="#b91c1c" letter-spacing="0.5">SECOND EDITION</text>

  <!-- Rademacher Complexity / Generalization Bounds geometric diagram -->
  <g transform="translate(45, 218)">
    <rect width="230" height="105" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <!-- Hyperplane margin -->
    <line x1="30" y1="85" x2="200" y2="20" stroke="#dc2626" stroke-width="2.5"/>
    <line x1="20" y1="72" x2="190" y2="7" stroke="#ef4444" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="40" y1="98" x2="210" y2="33" stroke="#ef4444" stroke-width="1" stroke-dasharray="3 3"/>
    
    <!-- Support vectors -->
    <circle cx="55" cy="45" r="4.5" fill="#dc2626"/>
    <circle cx="85" cy="30" r="4.5" fill="#dc2626"/>
    <circle cx="110" cy="50" r="4.5" fill="#dc2626"/>
    <circle cx="160" cy="18" r="4.5" fill="#dc2626"/>
    
    <circle cx="95" cy="85" r="4.5" fill="#0284c7"/>
    <circle cx="130" cy="72" r="4.5" fill="#0284c7"/>
    <circle cx="170" cy="65" r="4.5" fill="#0284c7"/>
  </g>

  <!-- Authors -->
  <text x="36" y="360" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Mehryar Mohri</text>
  <text x="36" y="378" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Afshin Rostamizadeh</text>
  <text x="36" y="396" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11.5" font-weight="700" fill="#0f172a">Ameet Talwalkar</text>

  <text x="36" y="420" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="10.5" fill="#64748b">Adaptive Computation and Machine Learning Series &bull; 2018</text>
</svg>

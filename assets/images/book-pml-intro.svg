<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="100%" height="100%">
  <defs>
    <linearGradient id="pml-intro-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
  </defs>

  <rect width="320" height="440" rx="8" fill="url(#pml-intro-grad)" stroke="#334155" stroke-width="1.5"/>
  <line x1="22" y1="0" x2="22" y2="440" stroke="#000" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="24" y1="0" x2="24" y2="440" stroke="#fff" stroke-opacity="0.1" stroke-width="1"/>

  <!-- MIT Press Logo Bars -->
  <g transform="translate(36, 32)">
    <rect x="0" y="0" width="3" height="18" fill="#ffffff"/>
    <rect x="5" y="0" width="3" height="18" fill="#ffffff"/>
    <rect x="10" y="0" width="3" height="18" fill="#ffffff"/>
    <rect x="15" y="0" width="3" height="18" fill="#ffffff"/>
    <rect x="20" y="0" width="3" height="18" fill="#ffffff"/>
    <rect x="25" y="0" width="3" height="18" fill="#ffffff"/>
    <text x="36" y="14" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" letter-spacing="1">THE MIT PRESS</text>
  </g>

  <!-- Title -->
  <text x="36" y="96" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Georgia, serif" font-size="25" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Probabilistic</text>
  <text x="36" y="126" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Georgia, serif" font-size="25" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Machine Learning</text>

  <!-- Subtitle -->
  <text x="36" y="156" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14" fill="#38bdf8" font-weight="600">An Introduction</text>

  <!-- Probabilistic Graphical Tree Artwork (Signature Murphy style) -->
  <g transform="translate(45, 185)">
    <rect width="230" height="135" rx="6" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Tree DAG branches -->
    <path d="M 115 25 L 60 70 M 115 25 L 170 70 M 60 70 L 30 115 M 60 70 L 90 115 M 170 70 L 140 115 M 170 70 L 200 115" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
    
    <!-- Nodes with probability gradients -->
    <circle cx="115" cy="25" r="10" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="60" cy="70" r="9" fill="#0369a1" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="170" cy="70" r="9" fill="#0369a1" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="30" cy="115" r="7" fill="#38bdf8"/>
    <circle cx="90" cy="115" r="7" fill="#38bdf8"/>
    <circle cx="140" cy="115" r="7" fill="#38bdf8"/>
    <circle cx="200" cy="115" r="7" fill="#38bdf8"/>
  </g>

  <!-- Author -->
  <text x="36" y="370" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Kevin P. Murphy</text>
  <text x="36" y="390" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" fill="#94a3b8">Adaptive Computation and Machine Learning Series &bull; 2022</text>
</svg>
